<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kennenlernbingo</title>
<style>
  :root {
    /* Farben Hochschule Fulda / Fachbereich Angewandte Informatik – hier zentral anpassbar */
    --fd-green: #5CC724;
    --fd-dark: #211F23;
    --fd-pale: #CBEDB9;
    --bg: #f4faf0;
    --ink: #211F23;
    --cell: #ffffff;
    --cell-border: #CBEDB9;
    --checked: #5CC724;
    --checked-ink: #211F23;
    --accent: #5CC724;
    --accent-ink: #211F23;
    --win-bg: #211F23;
    --win-ink: #5CC724;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #211F23; --ink: #f4faf0; --cell: #2f2d33; --cell-border: #44414a;
      --win-bg: #f4faf0; --win-ink: #211F23;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  header { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 4px solid var(--fd-green); }
  #logo { display: block; max-height: 48px; max-width: 55%; width: auto; }
  #logo-fallback small { font-weight: 600; font-size: .72rem; }
  #logo-fallback { font-weight: 800; font-size: 1.15rem; line-height: 1.05; border-left: 8px solid var(--fd-green); padding-left: 8px; }
  h1 { font-size: clamp(1.3rem, 6vw, 1.9rem); margin: 12px 0 0; width: 100%; max-width: 560px; }
  #lang { background: transparent; color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .95rem; cursor: pointer; }
  #hint { max-width: 560px; width: 100%; margin: 8px 0 12px; font-size: .95rem; line-height: 1.4; }
  #board {
    width: 100%; max-width: 560px; display: grid; gap: 6px;
    grid-template-columns: repeat(var(--n), 1fr);
  }
  .cell {
    aspect-ratio: 1 / 1; min-width: 0; padding: 4px;
    background: var(--cell); color: var(--ink);
    border: 2px solid var(--cell-border); border-radius: 10px;
    font: inherit; font-size: clamp(.55rem, calc(3.4vw - var(--n) * .25vw + .3rem), 1rem);
    line-height: 1.15; text-align: center; hyphens: auto; overflow-wrap: anywhere;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s, color .15s, transform .1s, border-color .15s;
  }
  .cell:active { transform: scale(.95); }
  .cell.checked { background: var(--checked); color: var(--checked-ink); border-color: var(--checked); font-weight: 700; }
  .cell.win { background: var(--win-bg); border-color: var(--win-bg); color: var(--win-ink); }
  .cell:focus-visible, button:focus-visible { outline: 3px solid var(--fd-green); outline-offset: 2px; }
  .actions { width: 100%; max-width: 560px; display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; padding: 12px 8px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; color: #fff; }
  #reset { background: var(--fd-dark); }
  #newcard { background: var(--accent); color: var(--accent-ink); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  #overlay.show { display: flex; }
  .modal { background: var(--cell); color: var(--ink); border-radius: 18px; padding: 28px 22px; width: 100%; max-width: 380px; text-align: center; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  .modal h2 { font-size: clamp(2.4rem, 14vw, 3.6rem); margin: 0 0 6px; color: var(--fd-green); text-shadow: 0 0 0 var(--fd-dark); letter-spacing: 2px; }
  .modal p { margin: 0 0 18px; }
  .modal button { display: block; width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; font-size: 1rem; color: #fff; cursor: pointer; }
  #m-new { background: var(--accent); color: var(--accent-ink) !important; }
  #m-go { background: var(--fd-dark); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .modal { animation: none; } .cell { transition: none; } }
</style>
</head>
<body>
<header>
  <img id="logo" alt="Hochschule Fulda – Fachbereich Angewandte Informatik" hidden>
  <div id="logo-fallback">Hochschule Fulda<br><small>Fachbereich Angewandte Informatik</small></div>
  <button id="lang" type="button"></button>
</header>
<h1 id="title"></h1>
<p id="hint"></p>
<main id="board" aria-live="polite"></main>
<div class="actions">
  <button id="reset" type="button"></button>
  <button id="newcard" type="button"></button>
</div>

<div id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="m-title"></h2>
    <p id="m-text"></p>
    <button id="m-new" type="button"></button>
    <button id="m-go" type="button"></button>
  </div>
</div>

<script>
/* ============ KONFIGURATION ============ */
const GRID_SIZE = 4;          // 3 = 3x3, 4 = 4x4, 5 = 5x5 ...
const DEFAULT_LANG = "de";    // "de" oder "en"

// Offizielles Logo der Hochschule Fulda hier einbinden (als data:-URI, damit die Datei standalone bleibt),
// z. B. "data:image/svg+xml;base64,...." oder "data:image/png;base64,....".
// Solange das Feld leer ist, wird der Textschriftzug als Platzhalter angezeigt.
const LOGO_SRC = "";

// Mögliche Inhalte (mindestens GRID_SIZE*GRID_SIZE Einträge pro Sprache!)
// Wichtig: gleiche Reihenfolge in de und en, damit der Sprachwechsel die Karte behält.
const ITEMS = {
  de: [
    "ein Instrument spielt", "schon einmal im Ausland gelebt hat", "mehr als 2 Sprachen spricht",
    "ein Haustier hat", "gern kocht", "Vegetarier/in ist", "einen Marathon gelaufen ist",
    "Kaffee nicht mag", "heute zu Fuß gekommen ist", "im selben Monat Geburtstag hat wie du",
    "Geschwister hat", "gern wandert", "ein Tattoo hat", "schon einmal ein Konzert gespielt hat",
    "Fan von Fantasy-Büchern ist", "gerne Brettspiele spielt", "schon mal auf einem Festival war",
    "eine Pflanze zu Hause hat, die lebt", "Fußball spielt", "gerne tanzt",
    "schon einmal einen Berg über 3000 m bestiegen hat", "Linkshänder/in ist", "gerne fotografiert",
    "mit dem Fahrrad zur Arbeit/Uni fährt", "ein Videospiel-Fan ist", "schon einmal im Fernsehen war",
    "gerne früh aufsteht", "Sushi liebt", "in einer anderen Stadt geboren wurde",
    "schon mal einen Fallschirmsprung gemacht hat", "jeden Tag Sport macht", "gerne zeichnet oder malt",
    "einen Garten hat", "einen Führerschein hat", "Tee statt Kaffee trinkt",
    "Zwillinge kennt", "gerne singt", "ein Lieblingsbuch nennen kann", "schon mal verschlafen hat"
  ],
  en: [
    "plays an instrument", "has lived abroad", "speaks more than 2 languages",
    "has a pet", "loves to cook", "is vegetarian", "has run a marathon",
    "doesn't like coffee", "came on foot today", "has a birthday in the same month as you",
    "has siblings", "likes hiking", "has a tattoo", "has performed in a concert",
    "loves fantasy books", "enjoys board games", "has been to a festival",
    "owns a plant that is still alive", "plays soccer", "loves to dance",
    "has climbed a mountain over 3,000 m", "is left-handed", "loves taking photos",
    "cycles to work/uni", "is a video game fan", "has been on TV",
    "likes getting up early", "loves sushi", "was born in another city",
    "has gone skydiving", "exercises every day", "likes drawing or painting",
    "has a garden", "has a driver's license", "drinks tea instead of coffee",
    "knows twins", "loves singing", "can name a favorite book", "has overslept before"
  ]
};

const TEXT = {
  de: {
    title: "Kennenlernbingo",
    hint: "Finde eine Person, die … Tippe ein Feld an, wenn du jemanden gefunden hast. Eine volle Reihe, Spalte oder Diagonale ergibt BINGO!",
    prefix: "Finde eine Person, die ",
    reset: "Zurücksetzen", newcard: "Neue Karte", lang: "English",
    bingo: "BINGO!", bingoText: "Du hast eine komplette Linie!",
    again: "Neue Karte", keep: "Weiterspielen"
  },
  en: {
    title: "Icebreaker Bingo",
    hint: "Find a person who … Tap a square when you've found someone. A full row, column or diagonal is a BINGO!",
    prefix: "Find a person who ",
    reset: "Reset", newcard: "New card", lang: "Deutsch",
    bingo: "BINGO!", bingoText: "You completed a full line!",
    again: "New card", keep: "Keep playing"
  }
};
/* ======================================= */

let lang = DEFAULT_LANG;
let card = [];            // Indizes in ITEMS (sprachunabhängig)
let checked = [];         // boolean pro Feld
let bingoShown = false;   // Popup nur einmal pro neuer Linie-Situation

const $ = id => document.getElementById(id);
const board = $("board");

function newCard() {
  const total = GRID_SIZE * GRID_SIZE;
  const pool = ITEMS.de.map((_, i) => i);
  for (let i = pool.length - 1; i > 0; i--) {          // Fisher-Yates
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  card = pool.slice(0, total);
  checked = Array(total).fill(false);
  bingoShown = false;
  render();
}

function resetCard() {
  checked = Array(card.length).fill(false);
  bingoShown = false;
  render();
}

function winningLines() {
  const n = GRID_SIZE, lines = [];
  for (let r = 0; r < n; r++) lines.push([...Array(n)].map((_, c) => r * n + c));
  for (let c = 0; c < n; c++) lines.push([...Array(n)].map((_, r) => r * n + c));
  lines.push([...Array(n)].map((_, i) => i * n + i));
  lines.push([...Array(n)].map((_, i) => i * n + (n - 1 - i)));
  return lines.filter(l => l.every(i => checked[i]));
}

function render() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  $("title").textContent = t.title;
  $("hint").textContent = t.hint;
  $("reset").textContent = t.reset;
  $("newcard").textContent = t.newcard;
  $("lang").textContent = t.lang;
  $("m-title").textContent = t.bingo;
  $("m-text").textContent = t.bingoText;
  $("m-new").textContent = t.again;
  $("m-go").textContent = t.keep;

  board.style.setProperty("--n", GRID_SIZE);
  board.innerHTML = "";
  const winCells = new Set(winningLines().flat());
  card.forEach((itemIdx, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell" + (checked[i] ? " checked" : "") + (winCells.has(i) ? " win" : "");
    b.textContent = ITEMS[lang][itemIdx];
    b.setAttribute("aria-pressed", checked[i]);
    b.title = t.prefix + ITEMS[lang][itemIdx];
    b.addEventListener("click", () => toggle(i));
    board.appendChild(b);
  });
}

function toggle(i) {
  checked[i] = !checked[i];
  render();
  const hasBingo = winningLines().length > 0;
  if (hasBingo && !bingoShown) {
    bingoShown = true;
    $("overlay").classList.add("show");
  } else if (!hasBingo) {
    bingoShown = false;
  }
}

$("reset").addEventListener("click", resetCard);
$("newcard").addEventListener("click", newCard);
$("lang").addEventListener("click", () => { lang = lang === "de" ? "en" : "de"; render(); });
$("m-new").addEventListener("click", () => { $("overlay").classList.remove("show"); newCard(); });
$("m-go").addEventListener("click", () => $("overlay").classList.remove("show"));

if (ITEMS.de.length < GRID_SIZE * GRID_SIZE || ITEMS.en.length !== ITEMS.de.length) {
  console.warn("Zu wenige Einträge oder de/en ungleich lang!");
}
if (LOGO_SRC) {
  $("logo").src = LOGO_SRC; $("logo").hidden = false; $("logo-fallback").hidden = true;
}
newCard();
</script>
</body>
</html>
