<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kennenlernbingo</title>
<meta name="theme-color" content="#FFFFFF">
<style>
  :root {
    /* Neutral wie Chrome (hell / dunkel); nur die unteren Buttons sind dunkelblau */
    --bg: #FFFFFF;
    --ink: #202124;
    --cell: #F1F3F4;
    --cell-border: #DADCE0;
    --nbtn: #E8EAED;          /* neutrale Buttons (Sprache, Modus, Weiterspielen) */
    --nbtn-ink: #202124;
    --checked: #5F6368;
    --checked-ink: #FFFFFF;
    --blue: #14407F;          /* Dunkelblau: Zurücksetzen / Neue Karte */
    --blue-ink: #FFFFFF;
    --win-bg: #202124;
    --win-ink: #FFFFFF;
    --focus: #1A73E8;
  }
  :root[data-theme="dark"] {
    --bg: #202124; --ink: #E8EAED; --cell: #292A2D; --cell-border: #5F6368;
    --nbtn: #3C4043; --nbtn-ink: #E8EAED;
    --checked: #9AA0A6; --checked-ink: #202124;
    --win-bg: #E8EAED; --win-ink: #202124; --focus: #8AB4F8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  header { width: 100%; max-width: 560px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  h1 { font-size: clamp(1.5rem, 7vw, 2.2rem); margin: 10px 0 0; width: 100%; max-width: 560px; color: var(--ink); }
  #lang, #theme { background: var(--nbtn); color: var(--nbtn-ink); border: 1px solid var(--cell-border); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .95rem; cursor: pointer; }
  #hint { max-width: 560px; width: 100%; margin: 8px 0 12px; font-size: .95rem; line-height: 1.4; }
  #board {
    width: 100%; max-width: 560px; display: grid; gap: clamp(3px, 1.2vw, 6px);
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    container-type: inline-size;
  }
  .cell {
    aspect-ratio: 1 / 1; min-width: 0; min-height: 0; overflow: hidden; padding: 2px;
    background: var(--cell); color: var(--ink);
    border: 2px solid var(--cell-border); border-radius: clamp(6px, 2vw, 10px);
    font: inherit; font-size: clamp(.5rem, calc(3.4vw - var(--n) * .25vw + .3rem), 1rem);
    font-size: clamp(8px, calc(100cqw / var(--n) * .135), 17px);
    line-height: 1.15; text-align: center; hyphens: auto; overflow-wrap: break-word; word-break: normal;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s, color .15s, transform .1s, border-color .15s;
  }
  .cell:active { transform: scale(.95); }
  .cell.checked { background: var(--checked); color: var(--checked-ink); border-color: var(--checked); font-weight: 700; }
  .cell.win { background: var(--win-bg); border-color: var(--win-bg); color: var(--win-ink); }
  .cell:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .actions { width: 100%; max-width: 560px; display: flex; gap: 8px; margin-top: 14px; }
  .actions button { flex: 1; padding: 12px 8px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; color: #fff; }
  #reset { background: var(--blue); color: var(--blue-ink); }
  #newcard { background: var(--blue); color: var(--blue-ink); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  #overlay.show { display: flex; }
  .modal { background: var(--cell); color: var(--ink); border-radius: 18px; padding: 28px 22px; width: 100%; max-width: 380px; text-align: center; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  .modal h2 { font-size: clamp(2.4rem, 14vw, 3.6rem); margin: 0 0 6px; color: var(--ink); letter-spacing: 2px; }
  .modal p { margin: 0 0 18px; }
  .modal button { display: block; width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; font-size: 1rem; color: #fff; cursor: pointer; }
  #m-new { background: var(--blue); color: var(--blue-ink) !important; }
  #m-go { background: var(--nbtn); color: var(--nbtn-ink) !important; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .modal { animation: none; } .cell { transition: none; } }
</style>
</head>
<body>
<header>
  <button id="theme" type="button"></button>
  <button id="lang" type="button"></button>
</header>
<h1 id="title"></h1>
<p id="hint"></p>
<main id="board" aria-live="polite"></main>
<div class="actions">
  <button id="reset" type="button"></button>
  <button id="newcard" type="button"></button>
</div>

<div id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="m-title"></h2>
    <p id="m-text"></p>
    <button id="m-new" type="button"></button>
    <button id="m-go" type="button"></button>
  </div>
</div>

<script>
/* ============ KONFIGURATION ============ */
const GRID_SIZE = 5;          // 3 = 3x3, 4 = 4x4, 5 = 5x5 ...
const DEFAULT_LANG = "de";    // "de" oder "en"

// Mögliche Inhalte (mindestens GRID_SIZE*GRID_SIZE Einträge pro Sprache!)
// Kurz halten (max. ca. 20 Zeichen, einzelne Wörter max. ca. 12), damit die Felder quadratisch bleiben.
// Wichtig: gleiche Reihenfolge in de und en, damit der Sprachwechsel die Karte behält.
const ITEMS = {
  de: [
    "spielt ein Instrument", "lebte im Ausland", "spricht 3 Sprachen", "hat ein Haustier",
    "kocht gern", "isst vegetarisch", "lief einen Marathon", "mag keinen Kaffee",
    "kam zu Fuß", "gleicher Geburtsmonat", "hat Geschwister", "wandert gern",
    "hat ein Tattoo", "stand auf einer Bühne", "liest Fantasy", "spielt Brettspiele",
    "war auf Festival", "hat lebende Pflanze", "spielt Fußball", "tanzt gern",
    "bestieg einen Berg", "ist Linkshänder*in", "fotografiert gern", "fährt Rad zur Uni",
    "zockt gern", "war im Fernsehen", "steht früh auf", "liebt Sushi",
    "woanders geboren", "sprang Fallschirm", "macht täglich Sport", "malt oder zeichnet",
    "hat einen Garten", "hat Führerschein", "trinkt lieber Tee", "kennt Zwillinge",
    "singt gern", "hat Lieblingsbuch", "hat verschlafen"
  ],
  en: [
    "plays an instrument", "lived abroad", "speaks 3 languages", "has a pet",
    "loves cooking", "is vegetarian", "ran a marathon", "dislikes coffee",
    "came on foot", "same birth month", "has siblings", "likes hiking",
    "has a tattoo", "was on a stage", "reads fantasy", "plays board games",
    "went to a festival", "has a living plant", "plays soccer", "loves dancing",
    "climbed a mountain", "is left-handed", "loves photos", "cycles to uni",
    "loves gaming", "was on TV", "wakes up early", "loves sushi",
    "born elsewhere", "went skydiving", "works out daily", "paints or draws",
    "has a garden", "has a license", "prefers tea", "knows twins",
    "loves singing", "has a fave book", "overslept once"
  ]
};

const TEXT = {
  de: {
    title: "Kennenlernbingo",
    hint: "Finde eine Person, die … Tippe ein Feld an, wenn du jemanden gefunden hast. Eine volle Reihe, Spalte oder Diagonale ergibt BINGO!",
    prefix: "Finde eine Person, die ",
    reset: "Zurücksetzen", newcard: "Neue Karte", lang: "English", toDark: "Dunkel", toLight: "Hell",
    bingo: "BINGO!", bingoText: "Du hast eine komplette Linie!",
    again: "Neue Karte", keep: "Weiterspielen"
  },
  en: {
    title: "Icebreaker Bingo",
    hint: "Find a person who … Tap a square when you've found someone. A full row, column or diagonal is a BINGO!",
    prefix: "Find a person who ",
    reset: "Reset", newcard: "New card", lang: "Deutsch", toDark: "Dark", toLight: "Light",
    bingo: "BINGO!", bingoText: "You completed a full line!",
    again: "New card", keep: "Keep playing"
  }
};
/* ======================================= */

let lang = DEFAULT_LANG;
let theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
document.documentElement.dataset.theme = theme;
let card = [];            // Indizes in ITEMS (sprachunabhängig)
let checked = [];         // boolean pro Feld
let bingoShown = false;   // Popup nur einmal pro neuer Linie-Situation

const $ = id => document.getElementById(id);
const board = $("board");

function newCard() {
  const total = GRID_SIZE * GRID_SIZE;
  const pool = ITEMS.de.map((_, i) => i);
  for (let i = pool.length - 1; i > 0; i--) {          // Fisher-Yates
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  card = pool.slice(0, total);
  checked = Array(total).fill(false);
  bingoShown = false;
  render();
}

function resetCard() {
  checked = Array(card.length).fill(false);
  bingoShown = false;
  render();
}

function winningLines() {
  const n = GRID_SIZE, lines = [];
  for (let r = 0; r < n; r++) lines.push([...Array(n)].map((_, c) => r * n + c));
  for (let c = 0; c < n; c++) lines.push([...Array(n)].map((_, r) => r * n + c));
  lines.push([...Array(n)].map((_, i) => i * n + i));
  lines.push([...Array(n)].map((_, i) => i * n + (n - 1 - i)));
  return lines.filter(l => l.every(i => checked[i]));
}

function render() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  $("title").textContent = t.title;
  $("hint").textContent = t.hint;
  $("reset").textContent = t.reset;
  $("newcard").textContent = t.newcard;
  $("lang").textContent = t.lang;
  $("theme").textContent = theme === "dark" ? t.toLight : t.toDark;
  $("m-title").textContent = t.bingo;
  $("m-text").textContent = t.bingoText;
  $("m-new").textContent = t.again;
  $("m-go").textContent = t.keep;

  board.style.setProperty("--n", GRID_SIZE);
  board.innerHTML = "";
  const winCells = new Set(winningLines().flat());
  card.forEach((itemIdx, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell" + (checked[i] ? " checked" : "") + (winCells.has(i) ? " win" : "");
    b.textContent = ITEMS[lang][itemIdx];
    b.setAttribute("aria-pressed", checked[i]);
    b.title = t.prefix + ITEMS[lang][itemIdx];
    b.addEventListener("click", () => toggle(i));
    board.appendChild(b);
  });
}

function toggle(i) {
  checked[i] = !checked[i];
  render();
  const hasBingo = winningLines().length > 0;
  if (hasBingo && !bingoShown) {
    bingoShown = true;
    $("overlay").classList.add("show");
  } else if (!hasBingo) {
    bingoShown = false;
  }
}

$("reset").addEventListener("click", resetCard);
$("newcard").addEventListener("click", newCard);
$("theme").addEventListener("click", () => { theme = theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = theme; render(); });
$("lang").addEventListener("click", () => { lang = lang === "de" ? "en" : "de"; render(); });
$("m-new").addEventListener("click", () => { $("overlay").classList.remove("show"); newCard(); });
$("m-go").addEventListener("click", () => $("overlay").classList.remove("show"));

if (ITEMS.de.length < GRID_SIZE * GRID_SIZE || ITEMS.en.length !== ITEMS.de.length) {
  console.warn("Zu wenige Einträge oder de/en ungleich lang!");
}
newCard();
</script>
</body>
</html>
